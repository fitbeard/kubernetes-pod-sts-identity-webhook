name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Set image tag'
        required: true
        default: 'test'

jobs:
  image:
    # this is to prevent the job to run at forked projects
    if: github.repository == 'fitbeard/kubernetes-pod-sts-identity-webhook'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go Version
        id: go-version
        run: echo "GO_VERSION=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Install QEMU static binaries
        uses: docker/setup-qemu-action@v3.7.0
    
      - name: Configure Buildkit
        uses: docker/setup-buildx-action@v3.12.0

      # - name: Authenticate with Quay.io
      #   uses: docker/login-action@v3.7.0
      #   with:
      #     registry: quay.io
      #     username: ${{ secrets.QUAY_USERNAME }}
      #     password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          REPO=fitbeard/kubernetes-pod-sts-identity-webhook
          docker buildx build \
                -t $REPO:$TAG \
                --build-arg golang_image=public.ecr.aws/eks-distro-build-tooling/golang:${{ steps.go-version.outputs.GO_VERSION }}-gcc \
                --platform=linux/amd64,linux/arm64 \
                --progress plain \
                --no-cache \
                .
#               --push
